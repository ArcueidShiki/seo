:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#4f46e5;--bg:#f6f7fb;--card:#fff;

*{box-sizing:border-box}
body{margin:0;font:14.5px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--brand)}
svg.i{width:18px;height:18px;flex:none;vertical-align:-3px}
header.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
header.bar .in{max-width:1400px;margin:0 auto;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink)}
.prog{display:flex;align-items:center;gap:8px;color:var(--muted)}
.bar-o{width:160px;height:8px;background:#eef0f4;border-radius:9px;overflow:hidden}.bar-i{height:100%;background:var(--brand);border-radius:9px;transition:width .2s}
.spacer{flex:1}
button,select,input[type=search]{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;color:var(--ink)}
button{cursor:pointer;display:inline-flex;gap:6px;align-items:center}button:hover{border-color:#c7cbd6}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.layout{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:18px;padding:16px 18px 60px}
aside{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.cat{display:flex;gap:10px;align-items:center;padding:7px 9px;border-radius:9px;cursor:pointer;color:#374151}
.cat:hover{background:#f3f4f6}.cat.on{background:#eef2ff;color:var(--brand);font-weight:600}
.cat .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.cat .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:13px;background:#fff;user-select:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.flabel{color:var(--muted);font-size:12px;margin-left:6px}
input[type=search]{min-width:220px}
section.group{margin-bottom:22px}
section.group>h2{display:flex;gap:10px;align-items:center;font-size:17px;margin:4px 0 4px}
section.group>p{color:var(--muted);margin:0 0 10px}
.ghead-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:26px 1fr auto;gap:10px}
.item.done{opacity:.62}.item.done .t{text-decoration:line-through}
.item input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--brand);cursor:pointer}
.t{font-weight:600;font-size:15px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.badge{font-size:11.5px;border-radius:6px;padding:1px 7px;background:#f3f4f6;color:#374151;white-space:nowrap}
.p0{background:#fee2e2;color:#991b1b}.p1{background:#fef3c7;color:#92400e}.p2{background:#e0e7ff;color:#3730a3}
.auto{background:#dcfce7;color:#166534}
.why{color:#4b5563;margin:6px 0 0}
.ca{margin:8px 0 0;padding:8px 10px;background:#f9fafb;border-radius:8px;border:1px dashed #e5e7eb}
.ca b{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.ca ul{margin:0;padding-left:18px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tool{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px;text-decoration:none;color:#374151;background:#fff}
.tool:hover{border-color:var(--brand)}
.tool img,.tool svg{width:16px;height:16px;border-radius:3px}
.status{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;color:#fff;white-space:nowrap;height:fit-content}
.s-pass{background:var(--pass)}.s-fail{background:var(--fail)}.s-warn{background:var(--warn)}.s-manual{background:var(--manual)}.s-na{background:var(--na)}
.sdetail{grid-column:2/4;font-size:12.5px;color:#374151;background:#f8fafc;border-left:3px solid var(--line);padding:4px 8px;border-radius:4px}
.sdetail.fail{border-color:var(--fail)}.sdetail.pass{border-color:var(--pass)}.sdetail.warn{border-color:var(--warn)}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:6px}
.empty{color:var(--muted);padding:30px;text-align:center}
.score{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.score .big{font-size:26px;font-weight:800}
#modal{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:14px;padding:18px;width:min(820px,100%);max-height:90vh;display:flex;flex-direction:column;gap:10px}
.mbox h3{margin:0}.mbox textarea{width:100%;height:55vh;font:12.5px/1.5 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:10px}
.mact{display:flex;gap:10px;align-items:center}.mact a.dl{font-size:14px}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none}}
@media print{header.bar,aside,.filters{display:none}.layout{display:block}.item{break-inside:avoid}}

  "items": [
    {
      "id": "kw-seed-expansion",
      "cat": "keyword",
      "phase": "plan",
      "priority": "P0",
      "title": "从种子词扩展出 ≥ 50 个候选关键词，建成关键词表",
      "why": "一个好关键词就是一个新的流量入口；凭感觉选题，页面写完也可能没人搜。",
      "checkAgainst": [
        "关键词表 ≥ 50 行，每行有：月搜索量、KD、CPC、搜索意图、来源",
        "来源至少覆盖 3 种：Google 下拉联想、SERP 底部「相关搜索」/ People Also Ask、AnswerThePublic / AlsoAsked、竞品排名词、LLM 扩展",
        "按三层扩展：核心词（ai poster generator）→ 场景词（… for instagram ads）→ 问题 / 对比 / 教程词（best …、X vs Y、how to …）"
      ],
      "how": "无痕窗口在 Google 输入种子词，记录下拉框和底部相关搜索；把种子词放进 AnswerThePublic / AlsoAsked 拿问题词；让 ChatGPT 按「场景 / 人群 / 问题」各列 20 个；最后在 Semrush / Ahrefs / Keyword Planner 批量补数据，没有搜索量的删掉。",
      "tools": [
        "google",
        "answerthepublic",
        "alsoasked",
        "chatgpt",
        "semrush",
        "ahrefs",
        "keywordplanner"
      ],
      "auto": false
    },
    {
      "id": "kw-volume-kd-threshold",
      "cat": "keyword",
      "phase": "plan",
      "priority": "P0",
      "title": "目标词过数据门槛：新站首批词 KD < 20 且月搜索量 > 500",
      "why": "新站外链少，高难度词基本排不上去；搜索量接近 0 的词意味着要自己教育市场，不适合独立开发者。",
      "checkAgainst": [
        "新站（DR < 20）首批目标词：Ahrefs KD < 20（Semrush KD% < 30）且月搜索量 > 500",
        "核心词（3–6 个月后再冲）：月搜索量 ≥ 1,000 且 KD < 50（笔记中的 KD 阈值区间为 20–50，起步取保守值）",
        "产品所在主题下有 > 100 个相关词，能做成一组页面，而不是只有一个词",
        "搜索量至少 2 个来源交叉确认：Semrush / Ahrefs / Keyword Planner 区间 / Google Trends 对比基准词",
        "Ahrefs 的 Parent Topic 是另一个词时，并入父主题页面，不单独建页"
      ],
      "how": "Ahrefs Keywords Explorer 或 Semrush Keyword Overview 查 Volume、KD、Parent Topic；Keyword Planner →「获取搜索量和预测」（只给区间，作参考够用）。Trends 估算法：和已知搜索量的基准词对比（如 tts ≈ 28 万/月），Trends 指数比值 × 基准搜索量 ≈ 估算值。",
      "tools": [
        "ahrefs",
        "semrush",
        "keywordplanner",
        "gtrends"
      ],
      "auto": false
    },
    {
      "id": "kw-serp-feasibility",
      "cat": "keyword",
      "phase": "plan",
      "priority": "P0",
      "title": "动笔前人工看一遍 Top 10，判断新站能不能打进去",
      "why": "KD 只是外链数量的估算；真正决定能否排上去的是前 10 名是谁、页面是不是专门为这个词写的。",
      "checkAgainst": [
        "每个目标词有一行 SERP 分析记录：大站占比、页面类型、是否专门针对该词、是否有论坛结果",
        "可做信号（满足 ≥ 2 条）：Top 10 有 ≥ 3 个 DR < 30 的小站；前 5 有 Reddit / Quora / 论坛结果；Top 3–5 的 title / H1 没有完整包含该词或只是顺带提到；有 2023 年后上线的站进入前 10",
        "放弃信号：Top 10 全是 DR > 70 的品牌站或大站内页；标题清一色「Best XXX in 2026 | Top XX Tools」式模板（改做更长尾的词）"
      ],
      "how": "无痕窗口按目标国家搜索（URL 加 &gl=us&hl=en）；用 Ahrefs SERP Overview 或 AITDK / Detailed SEO 插件看每个结果的 DR；逐个打开前 5 名，看 title、H1、目录是否围绕该词，正文有没有步骤、对比、结论。",
      "tools": [
        "google",
        "ahrefs",
        "semrush"
      ],
      "auto": false
    },
    {
      "id": "kw-intent-page-type",
      "cat": "keyword",
      "phase": "plan",
      "priority": "P0",
      "title": "页面类型与 SERP 意图一致：工具页、教程、对比页还是清单",
      "why": "Top 10 都是教程和清单时产品页排不上去；Top 10 都是工具页时，博客文章同样排不上去。",
      "checkAgainst": [
        "每个关键词标注意图：信息型 / 商业调研型（best、vs、alternative）/ 交易型（tool、generator、online、free）/ 导航型",
        "计划的页面类型 = Top 10 中占多数（≥ 6/10）的页面类型",
        "交易型词 → 工具页 / 落地页；信息型 → 文章；对比型 → 对比页或清单页"
      ],
      "how": "关键词表加三列：「意图」「Top 10 主流页面类型」「计划页面类型」，三列不一致的行标红重新规划。",
      "tools": [
        "google",
        "semrush"
      ],
      "auto": false
    },
    {
      "id": "kw-trend-direction",
      "cat": "keyword",
      "phase": "plan",
      "priority": "P1",
      "title": "用 Trends 确认关键词在上升或稳定，不是一阵风",
      "why": "正在下降的词做完也没流量；刚开始上升的新词竞争小、机会大。",
      "checkAgainst": [
        "5 年视图不是单峰，近 12 个月持平或上升",
        "新词机会：在词根（generator / maker / editor / tool）的 Related queries → Rising 中出现，且 7 天 / 30 天 / 90 天视图都在上升",
        "中文词同时看百度指数（或 360 趋势 / 巨量算数），曲线不是持续下降"
      ],
      "how": "Google Trends 输入候选词，依次切换 Past 5 years / 12 months / 90 days / 30 days / 7 days；输入词根看 Rising；中文词在百度指数里看趋势和需求图谱。",
      "tools": [
        "gtrends",
        "explodingtopics",
        "baidu-index"
      ],
      "auto": false
    },
    {
      "id": "kw-competitor-gap",
      "cat": "keyword",
      "phase": "plan",
      "priority": "P1",
      "title": "拆解 3–5 个竞品的流量词和 Top Pages，列出内容缺口",
      "why": "竞品已经替你验证过哪些词能带来流量；最近流量暴涨的网站，往往刚吃到一个新词或容易的词。",
      "checkAgainst": [
        "竞品表：每个竞品的月访问量、主要渠道、Top 10 流量页面、Top 20 流量词",
        "内容缺口：竞品有排名而你没有页面的词 ≥ 20 个，已并入关键词表",
        "每月看一次 traffic.cv 等流量飙升榜，记录同领域流量突增的网站和它新增的关键词"
      ],
      "how": "Semrush → Organic Research / Keyword Gap；Ahrefs → Site Explorer → Top pages / Content gap；Similarweb 看渠道构成。没有付费工具时，Semrush 免费额度（约 10 次 / 天）只查最重要的竞品。",
      "tools": [
        "semrush",
        "ahrefs",
        "similarweb",
        "trafficcv"
      ],
      "auto": false
    },
    {
      "id": "kw-core-five",
      "cat": "keyword",
      "phase": "plan",
      "priority": "P1",
      "title": "选定 5 个核心关键词，其中至少 1 个能较快冲进前 3",
      "why": "先拿到一个能带来流量的词，才有数据和动力继续优化；难度要搭配，不要全押大词。",
      "checkAgainst": [
        "核心词 5 个，每个都和产品高度相关",
        "至少 1 个词的 SERP 分析结论为「弱竞争」（新站 3 个月内有望进前 3）",
        "每个核心词在「关键词 → URL」映射表里对应唯一一个 URL"
      ],
      "how": "关键词表按「相关性 × 搜索量 ÷ 难度」排序挑 5 个；给每个词指定落地 URL，并在排名跟踪里建项目。",
      "tools": [
        "ahrefs",
        "semrush",
        "gsc"
      ],
      "auto": false

      "phase": "plan",

      "title": "中文市场按平台分别建关键词表：百度、小红书、抖音、微信、知乎、B站",

    groups = [...m.entries()].sort((a, b) => b[1].length - a[1].length).map(([k, its]) => {
      const p = P[k] || { name: k === '_none' ? '无需工具' : k };
      return { head: `${p.domain ? `<img src="${favicon(p.domain)}" width="22" height="22" alt="" style="border-radius:5px" onerror="this.outerHTML=window.__globe">` : icon('wrench')} ${esc(p.name)}`, desc: p.desc || '', items: its };
    });
  } else if (gb === 'phase') {
    groups = DATA.phases.map(p => ({ head: `${icon(p.icon || 'flag', '#4f46e5')} ${esc(p.name)}`, desc: p.desc || '', items: vis.filter(i => i.phase === p.id) })).filter(g => g.items.length);
  } else {
    groups = DATA.categories.map(c => ({ head: `<span class="ghead-ico" style="background:${c.color}1a">${icon(c.icon, c.color)}</span>${esc(c.name)} <small style="color:var(--muted);font-weight:400">${esc(c.nameEn || '')}</small>`, desc: c.desc, items: vis.filter(i => i.cat === c.id) })).filter(g => g.items.length);
  }
  document.getElementById('list').innerHTML = groups.length ? groups.map(g => `<section class="group"><h2>${g.head}</h2>${g.desc ? `<p>${esc(g.desc)}</p>` : ''}${g.items.map(i => itemHtml(i, rep)).join('')}</section>`).join('') : '<div class="empty">没有符合筛选条件的条目</div>';
  document.querySelectorAll('#list input[type=checkbox]').forEach(cb => cb.onchange = () => { if (cb.checked) state[cb.dataset.id] = Date.now(); else delete state[cb.dataset.id]; save(); render(); });
}
function download(name, text, type) {
  const m = document.getElementById('modal');
  m.querySelector('h3').textContent = '导出 ' + name;
  const ta = m.querySelector('textarea'); ta.value = text;
  const a = m.querySelector('a.dl'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  m.hidden = false; ta.focus(); ta.select();
}
document.getElementById('exportMd').onclick = () => {
  const md = ['# SEO / GEO / 增长 Checklist', '', `导出时间：${new Date().toLocaleString()}`, ''];
  DATA.categories.forEach(c => {
    const its = DATA.items.filter(i => i.cat === c.id); if (!its.length) return;
    md.push(`## ${c.name}`, '');
    its.forEach(i => { md.push(`- [${state[i.id] ? 'x' : ' '}] **${i.title}** (${i.priority}, ${phases[i.phase]?.name || i.phase})`); (i.checkAgainst || []).forEach(x => md.push(`  - ${x}`)); });
    md.push('');
  });
  download('seo-checklist.md', md.join('\n'), 'text/markdown');
};
document.getElementById('exportJson').onclick = () => download('seo-checklist-progress.json', JSON.stringify(state, null, 2), 'application/json');
(() => { const btn = document.getElementById('reset'); let armed = null;
  btn.onclick = () => {
    if (!armed) { btn.dataset.label = btn.innerHTML; btn.innerHTML = '再点一次确认清空'; btn.classList.add('primary'); armed = setTimeout(() => { btn.innerHTML = btn.dataset.label; btn.classList.remove('primary'); armed = null; }, 3000); return; }
    clearTimeout(armed); armed = null; btn.innerHTML = btn.dataset.label; btn.classList.remove('primary'); state = {}; save(); render();
  }; })();

document.getElementById('mclose').onclick = () => { document.getElementById('modal').hidden = true; };
document.getElementById('mcopy').onclick = async () => {
  const ta = document.querySelector('#modal textarea'), msg = document.getElementById('mmsg');
  try { await navigator.clipboard.writeText(ta.value); msg.textContent = '已复制 ✓'; }
  catch (e) { ta.select(); msg.textContent = '请按 Ctrl/Cmd + C 复制'; }
};
render();
</script>
</body>
