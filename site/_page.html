<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="robots" content="{{ROBOTS}}">
<link rel="icon" href="{{PATH}}/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary">
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#4f46e5;--bg:#fafafa}
*{box-sizing:border-box}
body{margin:0;font:16px/1.75 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--brand)}
.top{border-bottom:1px solid var(--line);background:#fff}
.top div{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;gap:18px;align-items:center}
.top a{text-decoration:none;color:var(--muted)}.top .brand{font-weight:700;color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:240px 1fr;gap:32px}
aside nav{position:sticky;top:16px;display:flex;flex-direction:column;gap:4px;font-size:14px}
aside a{text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:8px}
aside a[aria-current]{background:#eef2ff;color:var(--brand);font-weight:600}
article{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 36px;min-width:0}
article h1{margin-top:0;line-height:1.25}
article h2{margin-top:2em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
article table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow:auto}
article th,article td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
article th{background:#f9fafb}
article code{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:.92em}
article pre{background:#111827;color:#e5e7eb;padding:14px;border-radius:8px;overflow:auto}
article pre code{background:none;padding:0}
article blockquote{margin:1em 0;padding:.5em 1em;border-left:4px solid var(--brand);background:#f5f3ff;color:#374151}
@media(max-width:860px){.wrap{grid-template-columns:1fr}aside nav{position:static}article{padding:20px}}
</style>
</head>
<body>
<div class="top"><div><a class="brand" href="{{PATH}}/">SEO Handbook</a><a href="{{PATH}}/tool/">Checklist 工具</a><a href="{{PATH}}/handbook/00-overview/">手册</a><a href="{{PATH}}/reports/">Before/After 报告</a></div></div>
<div class="wrap">
<aside><nav aria-label="手册目录">{{NAV}}</nav></aside>
<article>{{BODY}}</article>
</div>
</body>
</html>
